# Semantic layer: Trials
# Source: public.trials (Beam course database)

table:
  name: trials
  fully_qualified_name: public.trials
  description: >
    One row per free trial a user started. Beam's free-trial program
    appears to have launched 2026-08-01 — trials before that date likely
    don't exist in this table (confirm if historical backfill exists).
    Standard trial length is 14 days.
  grain: One row per trial_id. ASSUMED a user can have at most one trial
    (first-time offer), but confirm whether repeat/win-back trials exist
    (multiple trial_id rows for the same user_id).
  primary_key: trial_id

columns:
  - name: trial_id
    type: int
    description: Primary key.
    role: primary key

  - name: user_id
    type: int
    description: Foreign key to users.user_id.
    role: foreign key / join key

  - name: started_at
    type: timestamp
    description: When the trial began.
    role: time dimension

  - name: ends_at
    type: timestamp
    description: Scheduled trial end (ASSUMED started_at + 14 days).
    role: time dimension

  - name: outcome
    type: varchar(255)
    description: >
      ASSUMED values like "converted" (became a paying subscriber),
      "expired" (trial ran out, no conversion), "canceled" (user cancelled
      during the trial). Confirm exact value list.
      Profile as of 2026-09-24 shows exactly two values among filled rows:
      converted (828) and canceled (827), plus NULL for open trials (inferred).
      There is no "expired".
    role: dimension

  - name: outcome_at
    type: timestamp
    description: >
      When the outcome was determined — may differ from ends_at (e.g. a
      user who cancels mid-trial has outcome_at before ends_at; a
      conversion might be recorded right at ends_at). Confirm.
    role: time dimension

important_caveats:
  - >
    For early trial-engagement behavior (sessions on day 1/2/3 of the
    trial) and the binary converted flag used for conversion-rate analysis,
    use ml.trial_snapshot / ml.trial_snapshot_latest rather than deriving
    this yourself from trials + sessions — it's already built for exactly
    that purpose (see that file for the bingeing-vs-steady question).

  - >
    Profile 2026-09-24: 2,073 rows, trial_id unique, and user_id is also
    unique, so each user has one trial (the ASSUMED first-time offer holds).
    started_at runs 2026-08-01 to 2026-09-24, so the program is 54 days old
    and there is no earlier period to compare against.
  - >
    outcome and outcome_at are NULL on 20.2% of rows (418), explained by the
    quirk "Trials mature late": all 418 are trials started 2026-09-11 or
    later that are still open. Do not count them as failures.
  - >
    Matured means ends_at on or before 2026-09-24: 1,553 trials (all with an
    outcome; 828 converted, 725 canceled). The other 520 started 2026-09-11 or
    later; 418 are open and 102 have already canceled early. Using outcome
    alone to define "matured" would keep those 102 cancellations and drop
    open trials, which biases conversion down. Define matured by ends_at.
  - >
    Every trial is exactly 14 days (ends_at = started_at + 14 days). Every
    cancellation is recorded before ends_at (inferred: users cancel mid-trial).
    For matured trials joined to trial_snapshot, none cancels inside the first
    3 days, so day 1 to 3 activity is not cut short by a cancellation.
    Conversions are recorded at or after ends_at.

relationships:
  - to: users
    via: [user_id]
  - to: trial_snapshot / trial_snapshot_latest
    via: [trial_id, user_id]

example_business_questions:
  - "What's the overall trial-to-paid conversion rate since the program launched?"
  - "Has trial conversion rate changed since the March 2026 price increase?"

