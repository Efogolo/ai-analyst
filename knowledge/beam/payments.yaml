# Semantic layer: Payments
# Source: public.payments (Beam course database)

table:
  name: payments
  fully_qualified_name: public.payments
  description: >
    One row per individual billing transaction against a subscription.
  grain: One row per payment_id.
  primary_key: payment_id

columns:
  - name: payment_id
    type: int
    description: Primary key.
    role: primary key

  - name: subscription_id
    type: int
    description: Foreign key to subscriptions.subscription_id. Join through
      subscriptions to reach user_id.
    role: foreign key / join key

  - name: payment_date
    type: timestamp
    description: When the payment was charged.
    role: time dimension

  - name: amount_usd
    type: numeric(10,2)
    description: Amount charged, in USD.
    role: measure (additive)
    # Profile as of 2026-09-24 (inferred): only three values exist, 10.00,
    # 12.00 and 100.00. Monthly plan is 10.00 before 2026-03-01 and 12.00 from
    # then on; annual is 100.00 throughout (no annual price change).

  - name: method
    type: varchar(255)
    description: >
      ASSUMED: payment method (e.g. "credit_card", "paypal", "apple_pay").
      Confirm exact value list.
      Profile as of 2026-09-24 shows exactly four values: card, paypal,
      apple_pay, google_pay (inferred). There is no "credit_card". card is the
      largest (about 50%). No nulls.
    role: dimension

important_caveats:
  - >
    amount_usd is the per-transaction charge, not a plan's list price — if
    Beam raised prices in March 2026, you can see the effect directly here
    as a jump in amount_usd for renewal payments on a given plan, which is
    useful corroborating evidence for the price-increase retention question
    (cross-reference with subscriptions.status changes shortly after).
  - >
    There's no direct user_id column — always join through subscriptions
    to roll payments up to a user or to user attributes like country.

  - >
    Profile 2026-09-24: 144,065 rows, payment_id unique, no nulls in any
    column. payment_date runs 2022-01-12 to 2026-09-24, ending on the data end
    date, so no payments sit in the future.
  - >
    amount_usd by plan (joined to subscriptions): monthly is 10.00 for 100,452
    payments up to 2026-02-28 and 12.00 for 37,384 payments from 2026-03-01.
    annual is 100.00 for 6,229 payments across the whole range. This matches
    the quirk "Monthly price change", so a 10 to 12 step is expected, not an error.
    Never compare monthly revenue across March 2026 without saying so.
  - >
    Payments cover 11,696 subscriptions. No payment belongs to a free
    subscription (all 18,234 free rows have none), so this table is paid plans
    only. Free users contribute no revenue.
  - >
    UNEXPLAINED: 235 paid subscriptions that have already started have no
    payment (189 monthly expired, 35 monthly canceled, 9 annual expired, 2 annual
    canceled). Inferred: trials or starts that never converted to a charge, not
    confirmed. A further 582 paid subscriptions (425 monthly, 157 annual) have
    no payment because they start after 2026-09-24 (quirk "Future start dates").
  - >
    Integrity checks pass: no orphan subscription_id, no payment before its
    subscription's start_date, and none after its end_date.

relationships:
  - to: subscriptions
    via: [subscription_id]

example_business_questions:
  - "What was total revenue (SUM amount_usd) by month this year?"
  - "Did the per-payment amount for renewals increase in March 2026, and by how much, by plan?"
  - "What's the most common payment method, and does it vary by country?"

