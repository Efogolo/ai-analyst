# Semantic layer: Subscriptions
# Source: public.subscriptions (Beam course database)

table:
  name: subscriptions
  fully_qualified_name: public.subscriptions
  description: >
    One row per subscription "spell" for a user — a continuous period on a
    given plan. ASSUMED: a user who upgrades/downgrades plans or
    re-subscribes after cancelling gets a NEW row rather than an update to
    an existing one — confirm this before treating COUNT(*) per user as
    meaningful (it would count plan changes as separate subscriptions).
  grain: One row per subscription_id, and subscriptions.user_id is also
    unique, so there is at most one row per user. Plan and subscription
    history is NOT recoverable from this table (see quirks.md "One
    subscription per user").
  primary_key: subscription_id

columns:
  - name: subscription_id
    type: int
    description: Primary key.
    role: primary key

  - name: user_id
    type: int
    description: Foreign key to users.user_id.
    role: foreign key / join key

  - name: plan
    type: varchar(255)
    description: >
      ASSUMED: the subscription tier/plan name (e.g. "monthly", "annual",
      or named tiers like "basic"/"premium"). Confirm exact value list and
      whether plan names encode price directly or price is only inferable
      from payments.amount_usd.
      Profile as of 2026-09-24 shows exactly three values: free, monthly,
      annual (inferred). No named tiers. free is the largest (about 59%).
    role: dimension

  - name: start_date
    type: timestamp
    description: When this subscription spell began.
    role: time dimension

  - name: end_date
    type: timestamp
    description: >
      When this subscription spell ended. ASSUMED NULL for currently-active
      subscriptions — confirm, rather than assuming a far-future sentinel
      date is used instead.
      Profile as of 2026-09-24 confirms NULL, not a sentinel: 87.9% of rows
      are NULL, and these are exactly the active rows (inferred).
    role: time dimension

  - name: status
    type: varchar(255)
    description: >
      ASSUMED values like "active", "canceled", "expired", possibly
      "past_due". Confirm the exact value list and whether status is kept
      in sync with end_date (e.g. could a row have status="active" but a
      populated end_date, or vice versa?).
      Profile as of 2026-09-24 shows exactly three values: active, expired,
      canceled (inferred), no past_due. Status and end_date are in sync:
      every active row has a NULL end_date, every expired or canceled row has one.
    role: dimension

important_caveats:
  - >
    Because each plan change or re-subscription likely creates a new row,
    "current subscription" for a user means the row with status not in a
    churned/expired state (or the most recent start_date) — not simply
    "the subscriptions row for this user_id" since there may be several.
  - >
    This table is central to the course's price-increase retention question
    ("Did the March 2026 price increase hurt retention, and for whom?").
    To analyze that, look at cancellation/non-renewal rates for
    subscriptions with start_date/renewal dates around March 2026, segmented
    by plan, country (via users), and device_type (via users) — status
    transitions to "canceled"/"expired" shortly after the price change is
    the key signal.

  - >
    Profile 2026-09-24: 30,747 rows, subscription_id unique, and user_id is
    also unique, so in this data each user has at most one row. The ASSUMED
    "plan change creates a new row" is not borne out (inferred: a plan change
    overwrites the row). Plan history cannot be rebuilt from this table.
    31,165 users vs 30,747 rows: some users have no subscription row.
  - >
    end_date is NULL on 87.9% of rows: all free rows (18,234, quirk "Free
    plans never end") plus active monthly (5,855) and annual (2,939) rows.
    No sentinel date is used. Exclude free before any churn or retention rate.
  - >
    Future dates, all explained by quirks. 1,549 active rows start after
    2026-09-24 (scheduled starts: 967 free, 425 monthly, 157 annual); start_date
    runs to 2026-10-04. 162 canceled rows have an end_date after 2026-09-24
    (154 monthly, 8 annual; scheduled cancellations, still active today); end_date
    runs to 2026-11-11. Count status="active" as is only after dropping future starts.
  - >
    No end_date before start_date, no orphan user_id, and no subscription
    starts before its user's signup date.
  - >
    Quirk "One subscription per user" (quirks.md): user_id is unique, COUNT(*)
    per user is 0 or 1, and plan changes and re-subscriptions are not kept as
    history. Any earlier note in this file about several rows per user is
    superseded by this.
  - >
    plan != 'free' is not a safe proxy for "paying". 235 started paid
    subscriptions (mostly expired) have no payment. Count paying users from
    payments (quirk "Payments are paid plans only"), not from this table.

relationships:
  - to: users
    via: [user_id]
  - to: payments
    via: [subscription_id]
    note: Each payment belongs to exactly one subscription spell.

example_business_questions:
  - "What's the active subscriber count by plan right now?"
  - "Did the March 2026 price increase hurt retention, and for whom?"
  - "What's the distribution of subscription length (start_date to end_date) by plan?"

