# Semantic layer: Users
# Source: public.users (Beam course database)

table:
  name: users
  fully_qualified_name: public.users
  description: >
    Core user dimension. One row per registered Beam user, with the
    attributes captured at signup.
  grain: One row per user_id.
  primary_key: user_id

important_caveats:
  - "Profile 2026-09-24: 31,165 rows, user_id unique (0 duplicates), no nulls in any column. Grain is clean."
  - "signup_date runs 2022-01-01 to 2026-09-24, which matches the end of the data. Users who signed up recently have had little time to subscribe or churn."
  - "country is a coarse bucket (US, EU, India, Rest), not a country list. Do not report 'Rest' as a country."
  - "Quirk \"Coarse country buckets\" (quirks.md): country takes only four values, US, EU, India and Rest. Rest is a catch-all, never to be reported as if it were a country."
  - "The September 2025 signup spike (see quirks.md) is in this table. Say so when signup counts by month enter a comparison."

columns:
  - name: user_id
    type: int
    description: Primary key. Referenced by subscriptions, payments (indirectly,
      via subscriptions), sessions, trials, user_revenue_summary,
      churn_snapshot, and trial_snapshot.
    role: primary key

  - name: signup_date
    type: timestamp
    description: When the user first registered.
    role: time dimension

  - name: country
    type: varchar(255)
    description: User's country at signup. ASSUMED fixed at signup rather than
      updated later — confirm whether this can change.
      Profile as of 2026-09-24 shows four values: US, Rest, India, EU (inferred;
      "Rest" is a catch-all bucket, not a country). No nulls.
    role: dimension

  - name: device_type
    type: varchar(255)
    description: >
      ASSUMED: the platform/device the user signed up on or primarily uses
      (e.g. "ios", "android", "web"). Confirm exact value list.
      Profile as of 2026-09-24 shows exactly three values: Web, Android, iOS
      (inferred; capitalised as shown, roughly one third each). No nulls.
    role: dimension

relationships:
  - to: subscriptions
    via: [user_id]
    note: A user can have multiple subscription rows over time (plan changes, re-subscriptions).
  - to: payments
    via: [user_id -> subscriptions.user_id -> subscriptions.subscription_id -> payments.subscription_id]
    note: No direct user_id column on payments — join through subscriptions.
  - to: sessions
    via: [user_id]
  - to: trials
    via: [user_id]
  - to: user_revenue_summary
    via: [user_id]
    note: Pre-aggregated per-user summary — prefer this over joining
      subscriptions+payments yourself for simple "total revenue by user"
      questions.
  - to: churn_snapshot / churn_snapshot_latest
    via: [user_id]
  - to: trial_snapshot / trial_snapshot_latest
    via: [user_id]

example_business_questions:
  - "How many users signed up by country and device type last quarter?"
  - "What's the geographic/device mix of users who have churned vs. retained?"

