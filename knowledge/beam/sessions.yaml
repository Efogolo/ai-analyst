# Semantic layer: Sessions
# Source: public.sessions (Beam course database)
#
# ⚠️ THIS TABLE IS VERY LARGE. Only query it with aggregate functions
# (COUNT, SUM, AVG, MIN/MAX) grouped by user_id and/or a date range.
# Never SELECT raw rows without a tight filter and a LIMIT — a scan of
# this whole table is expensive and usually not what the question needs.

table:
  name: sessions
  fully_qualified_name: public.sessions
  description: >
    One row per individual user listening/activity session. This is an
    event-level fact table, not a summary — it is large by nature since
    it logs every session for every user. Use marts.user_activity_metrics
    for company-wide daily active-user trends, and ml.churn_snapshot /
    ml.trial_snapshot for pre-aggregated per-user session features —
    only query sessions directly when those don't already have what you need.
  grain: One row per session_id (one user activity session).
  primary_key: session_id

columns:
  - name: session_id
    type: int
    description: Primary key.
    role: primary key

  - name: user_id
    type: int
    description: Foreign key to users.user_id.
    role: foreign key / join key

  - name: session_date
    type: timestamp
    description: When the session occurred.
    role: time dimension

  - name: duration_minutes
    type: int
    description: Length of the session in minutes.
    role: measure (additive, but prefer AVG for "typical session length"
      questions — see caveat)

  - name: activity_type
    type: varchar(255)
    description: >
      ASSUMED: the kind of activity during the session (e.g. "listen",
      "browse", "search", "download"). Confirm exact value list — this
      likely relates to the listen_share_90d feature in ml.churn_snapshot
      (share of sessions/time that were "listen" activity vs. other types).
      Profile as of 2026-09-24 shows exactly three values: browse, listen,
      read (inferred). There is no "search" or "download". "browse" is the
      largest at about 60% of sessions, "listen" about 30%, "read" about 10%.
    role: dimension

important_caveats:
  - >
    Always aggregate (COUNT/SUM/AVG) grouped by user_id and a date range;
    never pull raw session rows in bulk.
  - >
    Quirk "Sessions past the data end" (quirks.md): session_date runs two
    days past the data's end (through 2026-09-26 vs. data ending 2026-09-24,
    273 rows). Filter to the analysis date before counting anything.
  - >
    SUM(duration_minutes) is additive and fine for "total listening time."
    For "typical session length," use AVG rather than SUM, and be aware a
    small number of very long sessions can skew AVG — consider also
    checking a median/percentile if the question is about typical behavior.
  - >
    This table is the raw source behind the trial-bingeing question ("do
    trial users who binge on day one and then go quiet convert worse?"),
    but ml.trial_snapshot already pre-aggregates sessions_day1/day2/day3 for
    trial users — use that table for that question instead of querying
    sessions directly.

  - >
    Profile 2026-09-24: 4,335,470 rows, session_id unique, no nulls in any
    column. Sessions belong to 29,568 distinct users, fewer than the 31,165 in
    users, so some users have no sessions (inferred: never active). Do not
    treat a missing user as zero-activity without checking.
  - >
    session_date runs 2022-01-12 to 2026-09-26, but the data ends on
    2026-09-24. 273 sessions fall on 2026-09-25 and 2026-09-26, after the
    analysis date. No quirk explains this (inferred: late-loaded or stray rows).
    Filter session_date to the analysis date or earlier for anything that
    counts what has happened.
  - >
    duration_minutes ranges 1 to 157 with median 7 and mean 10.5 (right
    skewed), no zero or negative values. Prefer the median for typical length.
  - >
    No orphan sessions (every user_id exists in users) and no session falls
    before its user's signup date.

relationships:
  - to: users
    via: [user_id]

example_business_questions:
  - "What's the average session duration by activity_type last month?"
  - "How many sessions per active user per week, on average?"

