# Semantic layer: User revenue summary (mart)
# Source: marts.user_revenue_summary (Beam course database)

table:
  name: user_revenue_summary
  fully_qualified_name: marts.user_revenue_summary
  description: >
    Pre-aggregated per-user summary of signup info, (likely) current plan,
    and lifetime payment activity. Use this instead of joining
    users+subscriptions+payments yourself for simple per-user revenue
    questions — it's already built for that.
  grain: One row per user_id.
  primary_key: user_id

columns:
  - name: user_id
    type: int
    description: Foreign key to users.user_id.
    role: primary key / foreign key

  - name: country
    type: varchar(255)
    description: Denormalized copy of users.country.
    role: dimension

  - name: signup_date
    type: timestamp
    description: Denormalized copy of users.signup_date.
    role: time dimension

  - name: plan
    type: varchar(255)
    description: >
      ASSUMED: the user's CURRENT or most-recent plan (since subscriptions
      can have multiple rows per user over time, this mart presumably picks
      one). Confirm whether this is "current active plan" or "most recent
      plan regardless of status" — matters for users who have fully churned.
    role: dimension

  - name: total_payments
    type: bigint
    description: Count of payment transactions (lifetime), not a dollar amount.
    role: measure (additive — but it's already a lifetime total; don't
      re-sum across rows since grain is one row per user)

  - name: total_revenue_usd
    type: numeric
    description: Lifetime sum of amount_usd across all this user's payments.
    role: measure (lifetime total, one row per user)

  - name: last_payment_date
    type: timestamp
    description: Most recent payment date for this user.
    role: time dimension

important_caveats:
  - >
    This is a snapshot/summary table refreshed on some cadence (ASSUMED —
    confirm how often, e.g. nightly dbt run) rather than a live view. For
    "as of right now" revenue questions on very recent activity, payments
    may be more current.

relationships:
  - to: users
    via: [user_id]

example_business_questions:
  - "Who are the top 20 users by lifetime revenue?"
  - "What's average lifetime revenue per user, by country and plan?"
